name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Build flavor
        required: true
        type: choice
        default: dev
        options:
          - prod
          - testnet
          - dev
      publish:
        description: Publish release to GitHub
        required: true
        type: boolean
        default: false

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_FLAVOR: ${{ github.event.inputs.flavor || 'prod' }}
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@1.22.21 --activate
          yarn --version

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        shell: pwsh
        run: yarn install --frozen-lockfile

      - name: Build installer
        shell: pwsh
        run: |
          $PUBLISH_FLAG = "--publish=never"
          if ("${{ github.event.inputs.publish }}" -eq "true") {
            $PUBLISH_FLAG = "--publish=always"
          }
          Write-Host "Building with flavor: $env:BUILD_FLAVOR, publish: $PUBLISH_FLAG"
          yarn run build:$env:BUILD_FLAVOR -- $PUBLISH_FLAG

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ env.BUILD_FLAVOR }}
          path: release/${{ env.BUILD_FLAVOR }}/
