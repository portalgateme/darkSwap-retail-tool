name: Build macOS Installer

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Build flavor
        required: true
        type: choice
        default: dev
        options:
          - prod
          - testnet
          - dev
      publish:
        description: Publish release to GitHub
        required: true
        type: boolean
        default: false

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_FLAVOR: ${{ github.event.inputs.flavor || 'prod' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.21 --activate
          yarn --version

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build installer
        run: |
          PUBLISH_FLAG="--publish=never"
          if [ "${{ github.event.inputs.publish }}" == "true" ]; then
            PUBLISH_FLAG="--publish=always"
          fi
          echo "Building with flavor: $BUILD_FLAVOR, publish: $PUBLISH_FLAG"
          yarn run build:$BUILD_FLAVOR -- $PUBLISH_FLAG

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ env.BUILD_FLAVOR }}
          path: |
            release/${{ env.BUILD_FLAVOR }}/*.dmg
            release/${{ env.BUILD_FLAVOR }}/*.zip
            !release/${{ env.BUILD_FLAVOR }}/builder-effective-config.yaml
